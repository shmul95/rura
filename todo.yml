tasks:
  - id: 1
    title: "Move message transmission fully to WebRTC"
    description: >
      Ensure that all message bodies are sent through the established WebRTC DataChannel
      instead of via the WebSocket signaling path. The server should never log or relay
      message content — only signaling commands like rtc_offer, rtc_answer, and rtc_ice.
    status: completed
    done: true
    notes: |
      - Server no longer relays message bodies over TCP/TLS; handlers are no-ops.
      - Server logs are sanitized to avoid printing message payloads.
      - Tests updated to reflect non-relay behavior. WebRTC signaling unchanged.

  - id: 2
    title: "Implement public key encryption for message payloads"
    description: >
      Replace Base64 message encoding with true E2EE encryption using the recipient’s
      public key. On send, encrypt with recipient's key; on receive, decrypt with own
      private key. Ensure compatibility with existing message DTOs in crates/models.
    status: pending
    done: false

  - id: 3
    title: "Maintain persistent WebRTC DataChannel"
    description: >
      Prevent creation of a new DataChannel for each message. Ensure a single persistent
      channel per peer is reused for all message traffic, with graceful reconnection logic
      when a channel closes. Eliminate repeated rtc_offer/rtc_answer cycles per message.
    status: pending
    done: false

