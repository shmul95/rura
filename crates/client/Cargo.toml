cargo-features = ["edition2024"]

[package]
name = "rura_client"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
rura_models = { path = "../models" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
flutter_rust_bridge = "=2.11.1"
rustls = { version = "0.23", default-features = false, features = ["std", "ring"] }
rustls-pemfile = "2.0"
once_cell = "1"
rusqlite = { version = "0.37.0", features = ["bundled"] }
argon2 = "0.5"
rand = "0.8"
chacha20poly1305 = { version = "0.10", features = ["std"] }
base64 = "0.21"
ring = "0.17"
webrtc = "0.14.0"
cpal = "0.15"
tokio = { version = "1.47", features = ["rt-multi-thread", "time"] }
hkdf = "0.12"
sha2 = "0.10"
x25519-dalek = "2"
hex = "0.4"

[features]
cli = []

[dev-dependencies]
tokio = { version = "1.47", features = ["rt-multi-thread", "macros", "net", "time", "sync", "io-util"] }
rcgen = "0.12"
tempfile = "3"
rura_server = { path = "../server" }
serial_test = "2"
